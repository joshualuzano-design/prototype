<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BISU - Security Entrance Portal</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #3b82f6;
      --bg: #0f172a;
      --surface: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --accent: #60a5fa;
      --border: rgba(255, 255, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('assets/campus_gate.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      overflow: hidden;
    }

    .portal-header {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInDown 0.8s ease-out;
    }

    .portal-header img {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
      background: white;
      padding: 5px;
      border-radius: 50%;
    }

    .portal-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin-bottom: 8px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .portal-header p {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 40px;
      max-width: 900px;
      width: 100%;
      animation: fadeInUp 0.8s ease-out 0.2s backwards;
    }

    .portal-card {
      background: var(--surface);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 50px 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .portal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
      pointer-events: none;
    }

    .portal-card:hover {
      transform: translateY(-15px);
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }

    .icon-box {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #3b82f6, #1e3a8a);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 3rem;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.4s;
    }

    .portal-card:hover .icon-box {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
    }

    .portal-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .portal-card p {
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      font-size: 1rem;
    }

    .footer-note {
      margin-top: 60px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
      animation: fadeIn 1s ease-out 1s backwards;
    }

    .footer-note a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 2px;
      margin-left: 10px;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .portal-header h1 {
        font-size: 2.2rem;
      }

      .grid-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <header class="portal-header">
    <img src="assets/logo.png" alt="BISU Logo" onerror="this.src='https://via.placeholder.com/120'">
    <h1>BISU-Calape Campus</h1>
    <p>Security Management System</p>
  </header>

  <div class="grid-container">
    <div class="portal-card" onclick="window.location.href='scanner.html'">
      <div class="icon-box">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2>Security Personnel</h2>
      <p>Access the QR Scanner for student and vehicle entry verification.</p>
    </div>

    <div class="portal-card" onclick="window.location.href='admin-login.html'">
      <div class="icon-box" style="background: linear-gradient(135deg, #1e293b, #0f172a);">
        <i class="fa-solid fa-user-tie"></i>
      </div>
      <h2>Administrator Portal</h2>
      <p>Manage records, view logs, and configure system settings.</p>
    </div>
  </div>

  <footer class="footer-note">
    System initialized. Ready for operations.
    <a href="setup.html">System Setup</a>
  </footer>
</body>

</html>
