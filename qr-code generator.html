<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Generator - BISU Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1e3a8a;
      --bg: #0f172a;
      --surface: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --border: rgba(255, 255, 255, 0.15);
      --accent: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('assets/campus_gate.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.2rem;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 32px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 32px;
      width: 100%;
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      margin-bottom: 32px;
      color: white;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 12px;
      display: inline-block;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      color: white;
      transition: all 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn-generate {
      width: 100%;
      background: white;
      color: var(--bg);
      border: none;
      padding: 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      background: #f8fafc;
    }

    .qr-output {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 380px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px dashed var(--border);
      border-radius: 20px;
      padding: 32px;
    }

    #qrcode {
      margin: 20px 0;
    }

    #qrcode img {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      border: 8px solid white;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-style: italic;
    }

    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 32px;
      width: 100%;
    }

    .btn-action {
      padding: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: white;
    }

    .students-card {
      grid-column: 1 / -1;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .student-item {
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .student-item:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
      transform: translateY(-4px);
    }

    .student-item strong {
      display: block;
      color: white;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .student-item span {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <button class="back-btn" onclick="window.location.href='admin-dashboard.html'">‹</button>
    <div>
      <h1>Bohol Island State University</h1>
      <p style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Calape
        Campus - QR Portal</p>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Generate QR</h2>
      <div class="form-group">
        <label>Input Type</label>
        <select id="inputType">
          <option value="text">General Information</option>
          <option value="student-id">Direct Student ID</option>
        </select>
      </div>
      <div class="form-group">
        <label>Content / Payload</label>
        <textarea id="qrInput" placeholder="Enter details or select a sample below..."></textarea>
      </div>
      <button class="btn-generate" onclick="generateQR()">Create QR Code</button>
    </div>

    <div class="card">
      <h2>QR Output</h2>
      <div class="qr-output">
        <div id="qrcode"></div>
        <p id="placeholderText" class="placeholder-text">The generated QR code will be displayed here</p>
      </div>
      <div class="action-group" id="actionGroup" style="display:none;">
        <button class="btn-action" onclick="downloadQR()">📥 Download PNG</button>
        <button class="btn-action" onclick="sendToScanner()">➡️ Send to Scanner</button>
      </div>
    </div>

    <div class="card students-card">
      <h2>Database Samples</h2>
      <div class="students-grid" id="studentsGrid"></div>
    </div>
  </div>

  <script>
    let currentQR = null;
    const students = [
      { id: '2024001', name: 'John Doe', course: 'BSCS', year: '1' },
      { id: '2024002', name: 'Jane Smith', course: 'BSIT', year: '2' },
      { id: '2024003', name: 'James Wilson', course: 'BSCE', year: '3' }
    ];

    function generateQR() {
      const input = document.getElementById('qrInput').value.trim();
      if (!input) return;

      document.getElementById('qrcode').innerHTML = '';
      document.getElementById('placeholderText').style.display = 'none';

      currentQR = new QRCode(document.getElementById('qrcode'), {
        text: input,
        width: 280,
        height: 280,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById('actionGroup').style.display = 'grid';
    }

    function downloadQR() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) return;
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = `qr-bisu-${Date.now()}.png`;
      link.click();
    }

    function sendToScanner() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) return;
      localStorage.setItem('pendingQrImage', canvas.toDataURL('image/png'));
      window.open('index.html', '_blank');
    }

    function loadStudent(s) {
      const data = `Type: Student\nID: ${s.id}\nName: ${s.name}\nCourse: ${s.course}\nYear: ${s.year}`;
      document.getElementById('qrInput').value = data;
      generateQR();
    }

    function init() {
      const grid = document.getElementById('studentsGrid');
      students.forEach(s => {
        const div = document.createElement('div');
        div.className = 'student-item';
        div.innerHTML = `<strong>${s.name}</strong><span>ID: ${s.id} • ${s.course}</span>`;
        div.onclick = () => loadStudent(s);
        grid.appendChild(div);
      });

      const textData = localStorage.getItem('selectedStudentTextData');
      if (textData) {
        localStorage.removeItem('selectedStudentTextData');
        document.getElementById('qrInput').value = textData;
        generateQR();
      }
    }

    init();
  </script>
</body>

</html>
